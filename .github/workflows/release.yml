name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller --onefile --noconsole --name SnapFloat --icon packaging/snapfloat.png snapfloat.py
      - uses: actions/upload-artifact@v7
        with:
          name: SnapFloat-windows
          path: dist/SnapFloat.exe
  linux:
    runs-on: ubuntu-22.04  # oldest glibc we build on = widest range of distros the AppImage runs on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Qt's X11 plugin needs these; installed here so PyInstaller bundles them into the AppImage
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1
      - run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: SnapFloat-linux-appimage
          path: dist/SnapFloat-x86_64.AppImage

  # Run the built files, not the source: v1.1.0's AppImage passed every source test but broke the programs it starts.
  smoke-linux:
    needs: linux
    runs-on: ubuntu-24.04  # a newer system than the build one, like most users'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SnapFloat-linux-appimage
      # the programs SnapFloat starts; the self-test checks each one still runs from inside the AppImage
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libglib2.0-bin gsettings-desktop-schemas dconf-gsettings-backend wl-clipboard
      - run: chmod +x SnapFloat-x86_64.AppImage && ./SnapFloat-x86_64.AppImage --appimage-extract-and-run --self-test
  smoke-windows:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SnapFloat-windows
      - run: choco install tesseract -y --no-progress
      - name: Self-test
        shell: pwsh
        run: |
          # the exe has no console: it writes its report to a file
          $p = Start-Process .\SnapFloat.exe -ArgumentList '--self-test=report.txt' -Wait -PassThru
          Get-Content report.txt
          exit $p.ExitCode

  release:
    needs: [smoke-linux, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            SnapFloat-windows/SnapFloat.exe
            SnapFloat-linux-appimage/SnapFloat-x86_64.AppImage
  # winget: opens the version-bump PR to microsoft/winget-pkgs. Needs a WINGET_TOKEN secret (a classic token with
  # public_repo, from an account with a fork of winget-pkgs); skipped until it exists.
  winget:
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: ShauryaShakya.SnapFloat
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
