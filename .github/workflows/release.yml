name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller pillow
      - run: pyinstaller --onefile --noconsole --name SnapFloat --icon packaging/snapfloat.png --paths . snapfloat/__main__.py
      # the installer (the portable exe stays too: Scoop and winget use it)
      - run: choco install innosetup -y --no-progress
      - name: Installer
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('packaging/snapfloat.png').save('packaging/snapfloat.ico', sizes=[(16, 16), (32, 32), (48, 48), (256, 256)])"
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\snapfloat.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: SnapFloat-windows
          path: |
            dist/SnapFloat.exe
            dist/SnapFloat-Setup.exe
  linux:
    runs-on: ubuntu-22.04  # oldest glibc we build on = widest range of distros the AppImage runs on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Qt's X11 plugin needs these; installed here so PyInstaller bundles them into the AppImage
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1
      - run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: SnapFloat-linux-appimage
          path: dist/SnapFloat-x86_64.AppImage

  # Run the built files, not the source: v1.1.0's AppImage passed every source test but broke the programs it starts.
  smoke-linux:
    needs: linux
    runs-on: ubuntu-24.04  # a newer system than the build one, like most users'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SnapFloat-linux-appimage
      # the programs SnapFloat starts; the self-test checks each one still runs from inside the AppImage
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libglib2.0-bin gsettings-desktop-schemas dconf-gsettings-backend wl-clipboard
      - run: chmod +x SnapFloat-x86_64.AppImage && ./SnapFloat-x86_64.AppImage --appimage-extract-and-run --self-test
  smoke-windows:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SnapFloat-windows
      - run: choco install tesseract -y --no-progress
      - name: Self-test
        shell: pwsh
        run: |
          # the exe has no console: it writes its report to a file
          $p = Start-Process .\SnapFloat.exe -ArgumentList '--self-test=report.txt' -Wait -PassThru
          Get-Content report.txt
          exit $p.ExitCode
      - name: Installer installs, runs and uninstalls cleanly
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\SnapFloat"
          $link = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SnapFloat.lnk"
          $p = Start-Process .\SnapFloat-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path "$dir\SnapFloat.exe") -or -not (Test-Path $link)) { throw "install failed ($($p.ExitCode))" }
          $p = Start-Process "$dir\SnapFloat.exe" -ArgumentList '--self-test=installed.txt' -Wait -PassThru
          Get-Content installed.txt
          if ($p.ExitCode) { throw "installed copy failed its self-test" }
          # the uninstaller copies itself to %TEMP% and returns at once, so wait for the folder to go
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if ((Test-Path $dir) -or (Test-Path $link)) { Get-ChildItem $dir -ErrorAction SilentlyContinue; throw "uninstall left files behind" }

  release:
    needs: [smoke-linux, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            SnapFloat-windows/SnapFloat.exe
            SnapFloat-windows/SnapFloat-Setup.exe
            SnapFloat-linux-appimage/SnapFloat-x86_64.AppImage
  # winget: opens the version-bump PR to microsoft/winget-pkgs. Needs a WINGET_TOKEN secret (a classic token with
  # public_repo, from an account with a fork of winget-pkgs); skipped until it exists.
  winget:
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: ShauryaShakya.SnapFloat
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
