name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name SnapFloat snapfloat.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SnapFloat.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SnapFloat-windows
          path: dist/SnapFloat.exe
  linux:
    runs-on: ubuntu-22.04  # oldest glibc we build on = widest range of distros the AppImage runs on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash packaging/build-appimage.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SnapFloat-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: SnapFloat-linux-appimage
          path: dist/SnapFloat-x86_64.AppImage
