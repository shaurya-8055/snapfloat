<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="0.55" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e8eefc" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1c1c1e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="160" fill="#ffffff" opacity="0.07"/>
  <circle cx="1210" cy="300" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="320" r="110" fill="#ffffff" opacity="0.05"/>

  <!-- the app icon: a screen with a small floating thumbnail -->
  <g transform="translate(96 82)" filter="url(#shadow)">
    <rect width="176" height="176" rx="44" fill="#ffffff"/>
    <rect x="18" y="18" width="140" height="140" rx="32" fill="#0a84ff"/>
    <rect x="76" y="88" width="66" height="48" rx="11" fill="#ffffff"/>
  </g>

  <text x="320" y="150" font-family="Inter, Segoe UI, Ubuntu, Cantarell, Helvetica, Arial, sans-serif" font-size="76"
        font-weight="800" fill="#ffffff" letter-spacing="-1">SnapFloat</text>
  <text x="322" y="204" font-family="Inter, Segoe UI, Ubuntu, Cantarell, Helvetica, Arial, sans-serif" font-size="32"
        font-weight="600" fill="#ffffff">Screenshots that float, then disappear.</text>
  <text x="322" y="248" font-family="Inter, Segoe UI, Ubuntu, Cantarell, Helvetica, Arial, sans-serif" font-size="22"
        fill="#ffffff" opacity="0.9">Capture · mark up · drag into any app · nothing piles up</text>

  <!-- a floating thumbnail card, like the app's -->
  <g transform="translate(980 150)" filter="url(#shadow)">
    <rect width="210" height="140" rx="16" fill="url(#glass)"/>
    <rect x="14" y="14" width="182" height="96" rx="8" fill="#dfe7fb"/>
    <path d="M40 92 L92 50" stroke="#ff3b30" stroke-width="6" stroke-linecap="round"/>
    <path d="M92 50 L74 52 M92 50 L88 68" stroke="#ff3b30" stroke-width="6" stroke-linecap="round"/>
    <rect x="112" y="44" width="66" height="40" rx="6" fill="none" stroke="#34c759" stroke-width="5"/>
    <rect x="14" y="120" width="120" height="6" rx="3" fill="#0a84ff"/>
  </g>
</svg>
